<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Shiny Hunt</title>
    <link rel="icon" href="Logo.png" type="image/png">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        img {
            width: 200px;
            margin-bottom: 20px;
        }
        .contador {
            text-align: center;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .botones {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 20px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-family: 'Press Start 2P', cursive;
        }
        button:hover {
            background-color: #ddd;
        }
        .valor {
            font-size: 40px;
            font-weight: bold;
            margin: 20px 0;
        }
        h1 {
            font-size: 24px;
        }
    </style>
</head>
<body>

    <img src="Pokemon/Charizard.gif" alt="Charizard shiny">

    <div class="contador">
        <h1>Charizard</h1>
        <div class="valor" id="valor">0</div>
        <div class="botones">
            <button onclick="modificarContador(1)">+1</button>
            <button onclick="resetContador()">Reset</button>
            <button onclick="modificarContador(-1)">-1</button>
        </div>
    </div>

    <script>
        let contador = 0;

        // Cargar contador guardado
        window.onload = function() {
            const guardado = localStorage.getItem("contadorCharizard");
            if (guardado !== null) {
                contador = parseInt(guardado);
                document.getElementById('valor').textContent = contador;
            }
        };

        // Función para sumar/restar
        function modificarContador(cambio) {
            contador += cambio;
            if (contador < 0) contador = 0;
            actualizarContador();
        }

        // Función para resetear
        function resetContador() {
            contador = 0;
            actualizarContador();
        }

        // Actualizar y guardar
        function actualizarContador() {
            document.getElementById('valor').textContent = contador;
            localStorage.setItem("contadorCharizard", contador);
        }
    </script>

</body>
</html>
