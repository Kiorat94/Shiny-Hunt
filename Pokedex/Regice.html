<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">

    <title>Shiny Hunt</title>

    <link rel="icon" href="Logo.png" type="image/png">
    
    <style>

        img {
            width: 200px;
            margin-bottom: 20px;
        }

    </style>
</head>
<body>

    <!-- Imagen encima del contador -->
    <img src="Pokemon/Regice.gif" alt="Regice shiny">

    <div class="contador">
        <h1>Regice</h1>
        <div class="valor" id="valor">0</div>
        <div class="botones">
            <button onclick="modificarContador(1)">+1</button>
            <button onclick="resetContador()">Reset</button>
            <button onclick="modificarContador(-1)">-1</button>
        </div>
    </div>

    <script>
        let contador = 0;

        // Cargar contador guardado
        window.onload = function() {
            const guardado = localStorage.getItem("contadorRegice");
            if (guardado !== null) {
                contador = parseInt(guardado);
                document.getElementById('valor').textContent = contador;
            }
        };

        // Función para sumar/restar
        function modificarContador(cambio) {
            contador += cambio;
            if (contador < 0) contador = 0;
            actualizarContador();
        }

        // Función para resetear
        function resetContador() {
            contador = 0;
            actualizarContador();
        }

        // Actualizar y guardar
        function actualizarContador() {
            document.getElementById('valor').textContent = contador;
            localStorage.setItem("contadorRegice", contador);
        }
    </script>

<br>

<div class="contenedor">

    <a href="../index.html" class="pokemon">Volver</a>

</div>

</body>
</html>
