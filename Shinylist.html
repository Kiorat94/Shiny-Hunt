<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Checklist</title>
    <link rel="icon" href="Logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    

    <style>
        body {
            font-family: 'Arial', sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
            font-family: 'Press Start 2P', cursive;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 16px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: white;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 8px;
            display: flex;
            align-items: center;
        }
        label {
            flex: 1;
            margin-left: 10px;
        }
        h1 {
          font-family: 'Press Start 2P', cursive;
          font-size: 24px;
        }
        .numero {
               font-size: 15px;
               color: #888;
               margin-right: 12px;
        }


    </style>
</head>
<body>

<div class="pokemon"><a href="index.html"> <h6>Volver</h6> </a></div>

<center><h1>Checklist Shiny</h1></center>

<br>

<center><input type="text" id="buscador" placeholder="Buscar Pokémon..." style=" width:500px; font-family: 'Press Start 2P', cursive;"></center>

<ul id="lista">
    
    <li>
        <input type="checkbox" id="poke1">
        <img src="iconos/1.png">
        <label for="poke1"> Bulbasaur <span class="numero">#001</label>
    </li>

    <li>
        <input type="checkbox" id="poke2">
        <img src="iconos/2.png">
        <label for="poke2"> Ivisaur <span class="numero">#002</label>
    </li>

    <li><input type="checkbox" id="poke3"><img src="iconos/3.png"><label for="poke3">Venusaur</label>3</li>
    <li><input type="checkbox" id="poke4"><img src="iconos/4.png"><label for="poke4">Charmander</label>4</li>
    <li><input type="checkbox" id="poke5"><img src="iconos/5.png"><label for="poke5">Charmeleon</label>5</li>
    <li><input type="checkbox" id="poke6"><img src="iconos/6.png"><label for="poke6">Charizard</label>6</li>
    <li><input type="checkbox" id="poke7"><img src="iconos/7.png"><label for="poke7">Squirtle</label>7</li>
    <li><input type="checkbox" id="poke8"><img src="iconos/8.png"><label for="poke8">Wartortle</label>8</li>
    <li><input type="checkbox" id="poke9"><img src="iconos/9.png"><label for="poke9">Blastoise</label>9</li>
    <li><input type="checkbox" id="poke10"><img src="iconos/10.png"><label for="poke10">Caterpie</label>10</li>
    <li><input type="checkbox" id="poke11"><img src="iconos/11.png"><label for="poke11">Metapod</label>11</li>
    <li><input type="checkbox" id="poke12"><img src="iconos/12.png"><label for="poke12">Butterfree</label>12</li>
    <li><input type="checkbox" id="poke13"><img src="iconos/13.png"><label for="poke13">Weedle</label>13</li>
    <li><input type="checkbox" id="poke14"><img src="iconos/14.png"><label for="poke14">Kakuna</label>14</li>
    <li><input type="checkbox" id="poke15"><img src="iconos/15.png"><label for="poke15">Beedrill</label>15</li>
    <li><input type="checkbox" id="poke16"><img src="iconos/16.png"><label for="poke16">Pidgey</label>16</li>
    <li><input type="checkbox" id="poke17"><img src="iconos/17.png"><label for="poke17">Pidgeotto</label>17</li>
    <li><input type="checkbox" id="poke18"><img src="iconos/18.png"><label for="poke18">Pidgeot</label>18</li>
    <li><input type="checkbox" id="poke19"><img src="iconos/19.png"><label for="poke19">Rattata</label>19</li>
    <li><input type="checkbox" id="poke144"><img src="iconos/144.png"><label for="poke144">Articuno</label>144</li>
    <li><input type="checkbox" id="poke145"><img src="iconos/145.png"><label for="poke145">Zapdos</label>145</li>
    <li><input type="checkbox" id="poke146"><img src="iconos/146.png"><label for="poke146">Moltres</label>146</li>
    <li><input type="checkbox" id="poke150"><img src="iconos/150.png"><label for="poke150">Mewtwo</label>150</li>
    <li><input type="checkbox" id="poke151"><img src="iconos/151.png"><label for="poke151">Mew</label>151</li>
    <li><input type="checkbox" id="poke243"><img src="iconos/243.png"><label for="poke243">Raikou</label>243</li>

                               

    <!-- Agregá más Pokémon acá -->
</ul>

<script>
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');

    // Cargar estado desde localStorage
    checkboxes.forEach(checkbox => {
        const saved = localStorage.getItem(checkbox.id);
        if (saved) checkbox.checked = JSON.parse(saved);
        checkbox.addEventListener('change', () => {
            localStorage.setItem(checkbox.id, checkbox.checked);
        });
    });

    // Buscador interactivo
    document.getElementById('buscador').addEventListener('input', function () {
        const filtro = this.value.toLowerCase();
        document.querySelectorAll('#lista li').forEach(item => {
            const texto = item.textContent.toLowerCase();
            item.style.display = texto.includes(filtro) ? '' : 'none';
        });
    });
</script>

</body>
</html>
